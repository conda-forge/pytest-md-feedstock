{% set name = "pytest-md" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pytest-md-{{ version }}.tar.gz
  sha256: 3b248d5b360ea5198e05b4f49c7442234812809a63137ec6cdd3643a40cf0112

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - pytest >=4.2.1
    - python >={{ python_min }}

test:
  imports:
    - pytest_md
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/hackebrot/pytest-md
  summary: Plugin for generating Markdown reports for pytest results
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
